name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Findings are also posted as annotations, readable from the API.
      - name: Clippy
        shell: bash
        run: |
          echo "::notice::$(rustc --version)"
          set +e
          cargo clippy --color never --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(error|warning)' clippy.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - run: cargo test --workspace
      - run: cargo run -p archisim-cli -- demo out
      - run: cargo run -p archisim-cli -- exportar out/demo.archisim out/reabierto
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}
          path: out/

  validate-ifc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ifcopenshell pytest
      - run: cargo run -p archisim-cli -- demo out
      - run: python scripts/validate_ifc.py out/demo.ifc
      # Save → open → export must give the same IFC (only the date may change).
      - run: cargo run -p archisim-cli -- exportar out/demo.archisim out/reabierto
      - run: diff <(grep -v FILE_NAME out/demo.ifc) <(grep -v FILE_NAME out/reabierto/demo.ifc)
        shell: bash
      - run: python scripts/validate_ifc.py out/reabierto/demo.ifc
      # IFC → project → IFC: the demo imported again exports a valid file,
      # and so do the files written by IfcOpenShell.
      - run: cargo run -p archisim-cli -- importar out/demo.ifc out/importado/demo.archisim
      - run: cargo run -p archisim-cli -- exportar out/importado/demo.archisim out/importado
      - run: python scripts/validate_ifc.py out/importado/demo.ifc
      - run: |
          for f in crates/archisim-ifc/tests/fixtures/*.ifc; do
            name=$(basename "$f" .ifc)
            cargo run -p archisim-cli -- importar "$f" "out/fixtures/$name.archisim"
            cargo run -p archisim-cli -- exportar "out/fixtures/$name.archisim" out/fixtures
            python scripts/validate_ifc.py "out/fixtures/$name.ifc"
          done
        shell: bash
      # A house drawn through the application with simulated clicks and keys,
      # and a 3D picture drawn with a software graphics adapter.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: ARCHISIM_TEST_OUT=$PWD/out/app cargo test -p archisim-app -- drawn_project gpu_tests
      - run: python scripts/validate_ifc.py out/app/sesion.ifc
      - run: test -f out/app/vista3d.png
      - uses: actions/upload-artifact@v4
        with:
          name: sesion-y-vista3d
          path: out/app/

  # A ready-to-run Windows build of the application with the demo house, to
  # download from the run's artifacts.
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p archisim-app -p archisim-cli
      - run: cargo run --release -p archisim-cli -- demo ArchiSim
      - run: copy target\release\archisim-app.exe ArchiSim\ArchiSim.exe
        shell: cmd
      # IFC files written by another program, to try "Importar IFC…".
      - run: mkdir ArchiSim\ejemplos-ifc && copy crates\archisim-ifc\tests\fixtures\*.ifc ArchiSim\ejemplos-ifc\
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiSim-Windows
          path: ArchiSim/

  # The macOS application: universal (Apple chip and Intel), in a disk
  # image with the demo house and the IFC examples.
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/macos_bundle.sh
      # Opening a project from the Finder reaches the application. Apps
      # started by `open` get their environment from launchd. What went
      # wrong is reported as job annotations.
      - run: |
          log="$PWD/dist/abiertos.txt"
          launchctl setenv ARCHISIM_OPENED_LOG "$log"
          if ! open -n -a "$PWD/dist/ArchiSim.app" "$PWD/dist/demo/demo.archisim"; then
            echo "::error::open no pudo lanzar ArchiSim.app"
          fi
          for i in $(seq 90); do
            grep -q demo.archisim "$log" 2>/dev/null && break
            sleep 1
          done
          launchctl unsetenv ARCHISIM_OPENED_LOG
          if grep -q demo.archisim "$log" 2>/dev/null; then
            echo "Recibido: $(cat "$log")"
            pkill -x ArchiSim || true
            exit 0
          fi
          echo "::error::ArchiSim no recibió demo.archisim en 90 s"
          pgrep -lx ArchiSim | sed 's/^/::warning::proceso /' || echo "::warning::ArchiSim no está en marcha"
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i archisim | head -2); do
            head -c 1500 ~/Library/Logs/DiagnosticReports/"$f" | tr '\n' ' ' | sed 's/^/::warning::informe de fallo: /'; echo
          done
          pkill -x ArchiSim || true
          # The program on its own, for its error output.
          ARCHISIM_OPENED_LOG="$log" "$PWD/dist/ArchiSim.app/Contents/MacOS/ArchiSim" > out.txt 2>&1 &
          sleep 15; kill %1 2>/dev/null || true
          tail -n 15 out.txt | sed 's/^/::warning::salida: /'
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiSim-Mac
          path: dist/ArchiSim-*.dmg
