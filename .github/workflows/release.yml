# Publishes a version on GitHub (Releases): when main gets a version (in
# Cargo.toml) that is not published yet, or when a tag such as v0.22.2 is
# pushed. It carries the Mac disk image, the Windows installer and the
# one-line Mac installer script, under fixed names so that
#   https://github.com/stronkel/archisim/releases/latest/download/<name>
# always gives the latest version.
name: Versión

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Whether there is something to publish: a tag, or a version of main
  # that has no release yet.
  decide:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.d.outputs.publish }}
      tag: ${{ steps.d.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::la etiqueta $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml"
              exit 1
            fi
            publish=true
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión $version ya está publicada."
            publish=false
          else
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  mac:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/macos_bundle.sh
      - run: cp dist/ArchiSim-*.dmg dist/ArchiSim-Mac.dmg
      # The same installation the published line will do, from this image.
      - run: |
          ARCHISIM_DMG=dist/ArchiSim-Mac.dmg ARCHISIM_DESTINO="$RUNNER_TEMP/Apps" scripts/instalar_mac.sh
          test -x "$RUNNER_TEMP/Apps/ArchiSim.app/Contents/MacOS/ArchiSim"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/ArchiSim-Mac.dmg

  windows:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p archisim-app -p archisim-cli
      - run: cargo run --release -p archisim-cli -- demo ArchiSim
      - run: copy target\release\archisim-app.exe ArchiSim\ArchiSim.exe
        shell: cmd
      - run: mkdir ArchiSim\ejemplos-ifc && copy crates\archisim-ifc\tests\fixtures\*.ifc ArchiSim\ejemplos-ifc\
        shell: cmd
      - name: Instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DVersion=$version" "/DSource=$PWD\ArchiSim" scripts\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item (Get-ChildItem dist\ArchiSim-*-Windows.exe | Select-Object -First 1).FullName dist\ArchiSim-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ArchiSim-Windows.exe

  publish:
    needs: [decide, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          version=${TAG#v}
          cp scripts/instalar_mac.sh dist/instalar-mac.sh
          cat > notas.md <<EOF
          **Mac** (Apple M1 y posteriores, e Intel). Abre Terminal (Aplicaciones → Utilidades), pega esta línea y pulsa Intro; instala o actualiza ArchiSim en Aplicaciones sin pasar por la cuarentena de macOS:

              curl -fsSL https://github.com/stronkel/archisim/releases/latest/download/instalar-mac.sh | bash

          **Windows**: descarga y ejecuta \`ArchiSim-Windows.exe\`.

          Qué cambia en esta versión: \`docs/BITACORA.md\`.
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --title "ArchiSim $version" --notes-file notas.md \
            dist/ArchiSim-Mac.dmg dist/ArchiSim-Windows.exe dist/instalar-mac.sh
