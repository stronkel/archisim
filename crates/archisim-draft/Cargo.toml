[package]
name = "archisim-draft"
description = "2D drafting geometry: AutoCAD-style editing (offset, trim, extend, fillet…), snaps, hatches and boundaries"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
archisim-core.workspace = true
# Outlines of the sans lettering (IBM Plex Sans, SIL Open Font License,
# in fonts/). The same version resvg already brings.
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }
