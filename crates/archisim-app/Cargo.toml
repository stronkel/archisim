[package]
name = "archisim-app"
description = "ArchiSim desktop application"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "archisim-app"
path = "src/main.rs"

[dependencies]
archisim-core.workspace = true
archisim-family.workspace = true
archisim-geom.workspace = true
archisim-draft.workspace = true
archisim-ifc.workspace = true
archisim-plan.workspace = true
archisim-export.workspace = true
archisim-file.workspace = true
archisim-dxf.workspace = true
archisim-library.workspace = true
archisim-mesh.workspace = true
archisim-ids.workspace = true
archisim-bcf.workspace = true
archisim-coord.workspace = true
archisim-cte.workspace = true
archisim-team.workspace = true
serde_json = "1"
eframe = "0.37"
resvg = { version = "0.48", default-features = false }
rfd = "0.17"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
# The event loop is created here (not by eframe) so that, on macOS, the
# application delegate that receives files opened from the Finder can be
# installed before it runs. Same version as eframe's.
winit = "0.30"

# macOS: receive the files opened from the Finder or dropped on the Dock
# icon (`application:openURLs:`, added to winit's application delegate).
# Same versions as winit's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSString", "NSURL"] }

# Windows: the icon and version information inside the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
pollster = "0.4"
