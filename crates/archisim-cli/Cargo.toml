[package]
name = "archisim-cli"
description = "ArchiSim command line"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "archisim"
path = "src/main.rs"

[dependencies]
archisim-core.workspace = true
archisim-geom.workspace = true
archisim-ifc.workspace = true
archisim-plan.workspace = true
archisim-export.workspace = true
archisim-file.workspace = true
archisim-library.workspace = true
archisim-ids.workspace = true
archisim-bcf.workspace = true
archisim-coord.workspace = true
# Only to measure how long the plan takes to draw on screen (`medir`).
resvg = { version = "0.48", default-features = false }
