# ArchiSim en el NAS (docs/IPAD.md): la versión web con usuario y
# contraseña, que se pone al día sola con cada versión publicada.
#
#   1. Copia esta carpeta al NAS (por ejemplo /volume1/docker/archisim).
#   2. Copia «ejemplo.env» como «.env» y pon tu usuario y la contraseña
#      cifrada (cómo, dentro del fichero).
#   3. docker compose up -d   (o «Proyecto» nuevo en Docker de UGOS Pro).
#   4. Abre http://<ip-del-nas>:4200 y, desde fuera de casa, publícalo con
#      Tailscale Funnel (README.md).
services:
  # Descarga la última versión web publicada en GitHub cada 10 minutos y
  # la deja en «web/actual»; solo cambia cuando hay una versión nueva.
  actualizador:
    image: alpine:3
    restart: unless-stopped
    volumes:
      - ./web:/srv/web
      - ./actualizar.sh:/actualizar.sh:ro
    command: ["sh", "/actualizar.sh"]

  # Sirve la página, pidiendo usuario y contraseña.
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "4200:80"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data

volumes:
  caddy_data:
