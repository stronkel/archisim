[workspace]
resolver = "2"
members = [
    "crates/archisim-family",
    "crates/archisim-dxf",
    "crates/archisim-mesh",
    "crates/archisim-flora",
    "crates/archisim-props",
    "crates/archisim-core",
    "crates/archisim-geom",
    "crates/archisim-draft",
    "crates/archisim-ifc",
    "crates/archisim-plan",
    "crates/archisim-render",
    "crates/archisim-export",
    "crates/archisim-file",
    "crates/archisim-library",
    "crates/archisim-bcf",
    "crates/archisim-ids",
    "crates/archisim-coord",
    "crates/archisim-cte",
    "crates/archisim-team",
    "crates/archisim-cli",
    "crates/archisim-app",
]

[workspace.package]
version = "0.73.0"
edition = "2021"
publish = false
authors = ["Antonio Fernández <antoniofernandez@ad5.es>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/stronkel/archisim"

[workspace.dependencies]
uuid = { version = "1", features = ["v4"] }
archisim-family = { path = "crates/archisim-family" }
archisim-dxf = { path = "crates/archisim-dxf" }
archisim-mesh = { path = "crates/archisim-mesh" }
archisim-flora = { path = "crates/archisim-flora" }
archisim-props = { path = "crates/archisim-props" }
archisim-core = { path = "crates/archisim-core" }
archisim-geom = { path = "crates/archisim-geom" }
archisim-draft = { path = "crates/archisim-draft" }
archisim-ifc = { path = "crates/archisim-ifc" }
archisim-plan = { path = "crates/archisim-plan" }
archisim-render = { path = "crates/archisim-render" }
archisim-export = { path = "crates/archisim-export" }
archisim-file = { path = "crates/archisim-file" }
archisim-library = { path = "crates/archisim-library" }
archisim-ids = { path = "crates/archisim-ids" }
archisim-bcf = { path = "crates/archisim-bcf" }
archisim-coord = { path = "crates/archisim-coord" }
archisim-cte = { path = "crates/archisim-cte" }
archisim-team = { path = "crates/archisim-team" }

# The plan view rasterises the 1:50 drawing on every change; keep the SVG
# renderer fast even in debug builds.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3

# `cargo build --profile perfil`: optimised, with symbols, to profile.
[profile.perfil]
inherits = "release"
debug = true
